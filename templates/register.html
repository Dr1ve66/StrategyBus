{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-lg-5">
        <h1 class="h3 mb-1 text-center fw-bold">Регистрация</h1>
        <p class="text-muted text-center mb-4">Создайте аккаунт для работы с системой</p>

        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Имя пользователя</label>
            <input
              class="form-control form-control-lg"
              name="username"
              value="{{ f_username or '' }}"
              required
              autofocus
              placeholder="Например: ivan_petrov"
              autocomplete="username"
            >
            <div class="form-text">Только буквы, цифры и знак «_», не менее 3 символов.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input
              class="form-control form-control-lg"
              type="email"
              name="email"
              value="{{ f_email or '' }}"
              required
              placeholder="you@example.com"
              autocomplete="email"
            >
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Пароль</label>
            <input
              class="form-control form-control-lg"
              type="password"
              name="password"
              required
              placeholder="Не менее 6 символов"
              autocomplete="new-password"
            >
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Повторите пароль</label>
            <input
              class="form-control form-control-lg"
              type="password"
              name="password2"
              required
              autocomplete="new-password"
            >
          </div>

          <button class="btn btn-primary btn-lg w-100" type="submit">
            Зарегистрироваться →
          </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted mb-0">
          Уже есть аккаунт? <a href="{{ url_for('login') }}" class="fw-semibold">Войти</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
